name: Release

# On a version tag (v0.3.0): test, build, package marco-<version>.tar.gz (+ .sha256) and publish a GitHub
# release with the notes from CHANGELOG.md, plus install.sh and install.sh.sha256. install.sh downloads that tarball.
# The demo video (marco-demo.mp4) is too big for the repository. The READMEs link to a fixed pre-release tagged
# "media" (releases/download/media/marco-demo.mp4), created once by hand:
#   gh release create media marco-demo.mp4 --prerelease --title "Media" --notes "Files linked from the README"
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - run: npm ci
      # the fast suite only: the headless-Chrome display tests (server/test/browser.js) already ran in CI on this
      # commit and take most of the time
      - name: Test (without the browser tests)
        run: npm test
        env:
          MARCO_SKIP_BROWSER: '1'
      - run: npx tsc --noEmit -p .
      - run: npm run check:release
      - run: npm run build
      - name: Shellcheck
        run: shellcheck install.sh deploy/*.sh deploy/marco scripts/*.sh
      - name: Package
        run: scripts/package-release.sh release
      - name: Smoke test the tarball
        run: |
          v="$(node -p "require('./package.json').version")"
          mkdir -p /tmp/smoke && tar -xzf "release/marco-$v.tar.gz" -C /tmp/smoke --strip-components=1
          cd /tmp/smoke && npm ci --omit=dev --no-audit --no-fund
          PORT=3999 DATA_DIR=/tmp/smoke-data node server/index.js & pid=$!
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3999/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3999/api/health
          kill "$pid"
      # the image people build with `docker compose up -d --build`: a release never goes out if it does not build
      - name: Docker image builds and starts
        run: |
          docker build -t marco:release .
          cid="$(docker run -d -p 127.0.0.1:3998:3000 marco:release)"
          ok=0; for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3998/api/health && { ok=1; break; }; sleep 1; done
          docker logs "$cid" | tail -20; docker rm -f "$cid" >/dev/null
          [ "$ok" = 1 ]
      - name: Release notes
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > release/notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          files=("release/marco-$v.tar.gz" "release/marco-$v.tar.gz.sha256" release/install.sh release/install.sh.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Marco $v" --notes-file release/notes.md --verify-tag
          fi
