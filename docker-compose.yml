# Marco with Docker Compose:  docker compose up -d
# Then get the one-time setup link from the log:  docker compose logs marco | grep setup
# open it (replace "localhost" with this server's address when you are on another device), and follow the
# first-run setup wizard (it creates the admin password). The display is at http://<server-ip>:3000/.
#
# Only the variables listed under `environment:` below reach the container. Put their values in a `.env` file
# next to this file (Compose reads it for the ${...} substitutions); anything else in `.env` is ignored.
services:
  marco:
    build: .
    image: marco:latest
    container_name: marco
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # No default admin password: the first visit to /admin/ opens the setup wizard, which creates it.
      # In Docker the wizard always asks for the one-time setup code printed in the log (SETUP_REQUIRE_TOKEN=1),
      # because inside a container every client can look like a LAN client.
      SETUP_REQUIRE_TOKEN: ${SETUP_REQUIRE_TOKEN:-1}
      # Optional: your own long random setup code (openssl rand -hex 16) instead of the generated one.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Optional, headless installs only: an initial admin password instead of the wizard (change it later in
      # Admin → Security). A value that breaks the password rules only works from the LAN. Leave it unset to use the wizard.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional: the https URL of your reverse proxy / domain. Needed for Google sign-in and calendar linking, and to
      # use that domain at all (other host names are refused: DNS-rebinding guard). Leave empty on a plain LAN install.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Optional: more host names the server answers to (comma-separated, e.g. calendar.example.com,.example.net).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # REQUIRED behind a reverse proxy (Caddy/nginx/cloudflared on this host or elsewhere): the proxy reaches the
      # container from the Docker bridge, so trust that range, e.g. TRUST_PROXY=172.16.0.0/12. Without it every
      # proxied client is treated as remote and cookies are not marked Secure.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Optional: 1 forces the Secure flag on the session cookie, 0 disables it (default: decided per request).
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Optional: session cookie key (default: generated and stored in /data/secrets.json).
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Optional: this server's LAN address for the display's welcome QR code (the container cannot see it).
      LAN_ADDRESS: ${LAN_ADDRESS:-}
      # Optional: poll = displays check for changes every 90 s instead of keeping /api/stream open (for proxies that
      # buffer server-sent events). Alerts and display commands do not reach displays in this mode yet.
      MARCO_LIVE: ${MARCO_LIVE:-}
      # Optional: Google OAuth client (see README → Connecting Google Calendar).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Optional: Google Maps / Routes API key for the commute time widget (can also be entered in Admin → Widgets).
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Optional: process time zone for "floating" iCal times (default: the zone set in the admin, applied live).
      # TZ: Europe/Lisbon
      # Optional: extra CA certificates for iCal feeds behind a private CA. Mount the file and point to it:
      # NODE_EXTRA_CA_CERTS: /certs/ca.pem
    # volumes for NODE_EXTRA_CA_CERTS:  - ./ca.pem:/certs/ca.pem:ro
    volumes:
      - marco-data:/data

volumes:
  marco-data:
