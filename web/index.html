<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Marco</title>
    <!-- Inter, Outfit and the "Marco Emoji" subset are bundled. Self-hosted servers also load Noto Color Emoji from
         Google Fonts from the page script (web/display/health.ts), so this page has no inline script. -->
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="app" class="preset-bigCalendar side-left booting">
      <div class="photo-area"><div class="ph-stack"></div><div class="scrim"></div></div>
      <section class="side">
        <div class="side-top">
          <div id="clock"></div>
          <div id="highlights"></div>
          <div id="nowplaying" style="display: none"></div>
        </div>
        <div class="side-mid">
          <div id="sched" style="display: none"></div>
          <div id="message" class="card msg" style="display: none"></div>
          <div id="todo" class="card todo" style="display: none"></div>
          <div id="countdowns" style="display: none"></div>
          <div id="uw-side"></div>
          <div id="side-agenda"></div>
        </div>
        <div class="side-bottom"><div id="weather"></div></div>
        <div class="photo-meta" style="display: none"></div>
        <!-- Personalizado (layout 'canvas'): the sidebar stack (web/display/widgets/canvas.ts) -->
        <div id="canvas-side" class="cv cv--side" hidden></div>
      </section>
      <section class="main">
        <div id="calendar"></div>
        <div id="agenda"></div>
        <div id="view"></div>
        <div id="kids"></div>
        <div id="uw-full"></div>
        <div class="main-strip">
          <div id="sched-strip" style="display: none"></div>
          <div id="cd-strip" style="display: none"></div>
        </div>
        <div id="news" style="display: none"></div>
        <!-- Personalizado (layout 'canvas'): the widget grid -->
        <div id="canvas" class="cv" hidden></div>
      </section>
      <!-- widgets in the corners: above the layout, below night dimming, alerts and the doorbell -->
      <div id="uw-corners" aria-hidden="true"><div class="uw-c tl"></div><div class="uw-c tr"></div><div class="uw-c bl"></div><div class="uw-c br"></div></div>
    </div>
    <div id="night" aria-hidden="true"></div>
    <div id="alerts" aria-live="polite"></div>
    <div id="identify" aria-hidden="true"></div>
    <div id="access-code" aria-hidden="true" aria-live="polite"></div>
    <div id="doorbell" aria-live="assertive"></div>
    <div id="status" aria-hidden="true"></div>
    <div id="privacy-lock" aria-hidden="true"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></div>
    <script type="module" src="/display/main.ts"></script>
  </body>
</html>
